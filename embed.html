<!DOCTYPE html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akili — Embed Demo</title>
    <style>
      /* Deliberately plain host styles — proves the widget ships its own,
         scoped CSS and does not depend on (or pollute) the page. */
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #26221c;
        background: #faf5ea;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .note {
        max-width: 540px;
        text-align: center;
      }
      .note h1 { font-size: 22px; margin: 0 0 10px; }
      .note p { color: #6b6354; line-height: 1.6; font-size: 15px; }
      .note code {
        background: #f3ebdc;
        border: 1px solid #e2d6bf;
        border-radius: 6px;
        padding: 2px 7px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="note">
      <h1>Akili — Embed Demo</h1>
      <p>
        This is an otherwise-empty page. The floating Akili assistant in the
        bottom-right corner is loaded from one standalone script and mounted with
        <code>Akili.mount()</code>. Everything (the engine, React and the widget's
        own scoped CSS) is bundled in and runs fully offline — no network calls.
      </p>
    </div>

    <!-- Build first:  npm run build:embed  -->
    <script src="./dist-embed/akili-widget.iife.js"></script>
    <script>
      // window.Akili is defined by the IIFE bundle.
      Akili.mount(undefined, { lang: 'sw', position: 'bottom-right' });
    </script>
  </body>
</html>
