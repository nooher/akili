version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group safe updates into a single PR; ignore breaking MAJOR bumps so
    # Dependabot never proposes (and Vercel never fails-to-preview-build)
    # incompatible majors like vite 8 vs @vitejs/plugin-react. Handle majors by hand.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
